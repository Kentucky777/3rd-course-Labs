{% extends "base.html" %}

{% block lab %}Лабораторная 4{% endblock %}

{% block main %}
<h1>Регистрация</h1>
<h2>Создание нового пользователя</h2>

<form method="post">
    <div>
        <label for="login">Логин:</label>
        <input type="text" id="login" name="login" value="{{ login or '' }}">
    </div>
    <div>
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}">
    </div>
    <div>
        <label for="gender">Пол:</label>
        <select id="gender" name="gender">
            <option value="мужской">Мужской</option>
            <option value="женский">Женский</option>
        </select>
    </div>
    <div>
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password">
    </div>
    <div>
        <label for="password_confirm">Подтверждение пароля:</label>
        <input type="password" id="password_confirm" name="password_confirm">
    </div>

    {% if error %}
        <div style="color: red; font-size: 18px;">{{ error }}</div>
    {% endif %}

    <div>
        <button type="submit">Зарегистрироваться</button>
        <button type="reset">Сбросить</button>
    </div>
</form>

<div>
    Уже зарегистрированы? <a href="/lab4/login">Войти</a>
</div>
{% endblock %}
