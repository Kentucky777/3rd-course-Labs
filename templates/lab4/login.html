{% extends "base.html" %}

{% block lab %}Лабораторная 4{% endblock %}

{% block main%}
{%if authorized %}
    <h1>Добро пожаловать, {{ name }}</h1>
    <div>
        <form action="/lab4/logout" method="post">
            <button>Выход</button>
        </form>
    </div>
{% else %}
    <h1>Вход</h1>
    <h2>Пожалуйста, авторизуйстесь</h2>
    <form method="post">
        <div>
            <label for="login">Пользователь</label>
            <input type="text" id="login" name="login" value="{{ login or ''}}"">
        </div>
        <div>
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password">
        </div>
        <div style="color: red; font-size: 26px;">{{ error }}</div>
        <div>
            <button type="submit">Войти</button>
            <button type="reset">Отмена</button>
        </div>
    </form>
{% endif %}
{% endblock %}
