{% extends "base.html" %}

{% block lab %}Лабораторная 3{% endblock %}

{% block main%}
    <h1>Оплата</h1>

    <div>
        Сумма к оплате : {{ price }}
    </div>

    <form action="/lab3/success/{{ price }}">
        <div>Номер баноквской карты</div>
        <label>
            <input type="txt" name="name">
        </label>

        <div>Номер CVV:</div>
        <label>
            <input type="txt" name="cvv" size="3" pattern="\d{3}">
        </label>

        <div>
            <button type="submit">Оплатить</button>
            <a href="/lab3/order">Отказаться</a>
        </div>
    </form>
{% endblock %}
