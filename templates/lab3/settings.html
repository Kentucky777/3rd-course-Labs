{% extends "base.html" %}

{% block lab %}Лабораторная 3{% endblock %}

{% block main%}
    <h1>Cookies</h1>>
    <form>
        <div>
            <label class="label" for="color">Выберите цвет текста:</label>
            <input type="color" id="color" name="color" value="{{ color or '' }}">
        </div>
        <div>
            <label class="label" for="back">Выберите цвет фона:</label>
            <input type="color" id="back" name="back" value="{{ back or '' }}">
        </div>
        <div>
            <label class="label" for="size">Выберите размер текста</label>
            <input type="number" id="size" name="size" value="{{ size or 16 }}">
        </div>
        <div>
            <button type="submit">ОК</button>
        </div>
    </form>
{% endblock %}
