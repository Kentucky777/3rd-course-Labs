{% extends "base.html" %}

{% block main %}
  <h1>Редактирование статьи</h1>

  {% if error %}
    <div style="color: red;">{{ error }}</div>
  {% endif %}

  <form method="post">
    <div>
      <label>
        Название статьи:
        <input type="text" name="title" value="{{ article['title'] }}" maxlength="50">
      </label>
    </div>

    <div>
      <label>
        Текст статьи:
        <textarea name="article_text">{{ article['article_text'] }}</textarea>
      </label>
    </div>
    <div>
      <label><input type="checkbox" name="is_favorite" {% if article['is_favorite'] %}checked{% endif %}> Любимая статья</label>
    </div>
    <div>
      <label><input type="checkbox" name="is_public" {% if article['is_public'] %}checked{% endif %}> Публичная статья</label>
    </div>
    <div>
      <button type="submit">Сохранить</button>
    </div>
  </form>
{% endblock %}
