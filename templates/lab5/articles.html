{% extends "base.html" %}

{% block lab %}Лабораторная 5{% endblock %}

{% block main%}
    {% if error %}
        {{ error }}
    {% else %}
        <h1>Статьи</h1>
        
        {% for article in articles %}
            <h2>{{ article ['title'] }} </h2>
            <blockquote>{{ article['article_text'] }}</blockquote>
            <a href="/lab5/edit/{{ article['id'] }}"><button type="button">Редактировать</button></a>
            <a href="/lab5/delete/{{ article['id'] }}"><button type="button">Удалить</button></a>
        {% endfor %}
    {% endif %}
{% endblock %}
