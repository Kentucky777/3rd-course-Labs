{% extends "base.html" %}

{% block lab %}Лабораторная 5{% endblock %}

{% block main%}
    <h1>База знаний</h1>
    <div style="display:flex; gap: 15px; margin: 15 auto">
        <a href="/lab5/list" class="btn"><button>Список моих статей</button></a>
        <a href="/lab5/public" class="btn"><button>Публичные статьи</button></a>
        <a href="/lab5/create" class="btn"><button>Создать статью</button></a>

            <a href="/lab5/logout" class="btn"><button>Выйти</button></a>

            <a href="/lab5/login" class="btn"><button>Войти</button></a>
            <a href="/lab5/register" class="btn"><button>Регистрация</button></a>
        {% endif %}
        <span>{{ login or 'Anonymous' }}</span>

{% endblock %}
