{% extends "base.html" %}

{% block lab %}Лабораторная 5{% endblock %}

{% block main%}
    <h1>Создание статьи</h1>
    
    <form method="POST">
        <div>
            <label>
                Название статьи
                <input type="text" max_length="50" name="title">
            </label>
        </div>
        <div>
            <label><input type="checkbox" name="is_favorite"> Любимая статья</label>
        </div>
        <div>
            <label><input type="checkbox" name="is_public"> Публичная статья</label>
        </div>
        <div>
            <textarea name="article_text"></textarea>
        </div>
        <div>
            <button type="submit">Готово</button>
        </div>
    </form>
{% endblock %}
