{% extends "base.html" %}

{% block lab %}Лабораторная 5{% endblock %}

{% block main %}
    <h1>Зарегистрированные пользователи</h1>
    <table border="1" cellpadding="6" style="border-collapse: collapse;">
        <tr>
            <th>Логин</th>
            <th>Имя</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user['login'] }}</td>
            <td>{{ user['real_name'] or 'Не указано' }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
